compatibility_flags = ["nodejs_compat"]

kv_namespaces = [
  { binding = "conversations", id = "00000000000000000000000000000001", preview_id = "00000000000000000000000000000002" },
  { binding = "metrics", id = "00000000000000000000000000000003", preview_id = "00000000000000000000000000000004" },
  { binding = "attribution", id = "00000000000000000000000000000005", preview_id = "00000000000000000000000000000006" },
